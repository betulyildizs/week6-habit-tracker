name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and quality tools
        run: python -m pip install -r requirements.txt black ruff

      - name: Check formatting
        run: python -m black --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q
